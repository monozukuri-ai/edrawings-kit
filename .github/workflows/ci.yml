name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: edrawings-kit
    steps:
      - uses: actions/checkout@v4
        with:
          path: edrawings-kit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v6
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync python scripts/check_backend.py
      - run: uv run --no-sync python scripts/release_metadata.py
      - run: uv run --no-sync python scripts/third_party_notices.py
      - run: uv run --no-sync ruff check python tests scripts
      - run: uv run --no-sync ruff format --check python tests scripts
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python scripts/check_public_tree.py
  distribution:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
        python: ['3.10', '3.14']
        include:
          - os: ubuntu-22.04
            python: '3.11'
          - os: ubuntu-22.04
            python: '3.12'
          - os: ubuntu-22.04
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        shell: bash
        working-directory: edrawings-kit
    steps:
      - uses: actions/checkout@v4
        with:
          path: edrawings-kit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev --python ${{ matrix.python }}
      - run: uv run --no-sync python scripts/check_backend.py
      - run: uv run --no-sync python scripts/release_metadata.py
      - run: cargo test --workspace --locked
      - run: uv run --no-sync pytest -q
      - name: Build Linux wheel with enforced glibc baseline
        if: runner.os == 'Linux'
        run: uv run --no-sync maturin build --release --compatibility manylinux_2_34 --out dist
      - name: Build Windows or macOS wheel
        if: runner.os != 'Linux'
        run: uv run --no-sync maturin build --release --out dist
      - name: Build and rebuild standalone sdist
        if: matrix.python == '3.10'
        run: |
          uv run --no-sync maturin sdist --out dist
          uv run --no-sync python scripts/verify_artifacts.py dist/*.whl --sdist dist/*.tar.gz --report .internal/ci/artifacts.json
      - name: Cold-install wheel
        if: matrix.python != '3.10'
        run: uv run --no-sync python scripts/verify_artifacts.py dist/*.whl --report .internal/ci/artifacts.json
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            edrawings-kit/dist/*
            edrawings-kit/.internal/ci/artifacts.json
          if-no-files-found: error
          include-hidden-files: true
  abi3_compat:
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
        python: ['3.14']
        include:
          - os: ubuntu-22.04
            python: '3.11'
          - os: ubuntu-22.04
            python: '3.12'
          - os: ubuntu-22.04
            python: '3.13'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: edrawings-kit
    steps:
      - uses: actions/checkout@v4
        with:
          path: edrawings-kit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-python-3.10
          path: download
      - name: Test the exact wheel produced on CPython 3.10
        run: python scripts/verify_artifacts.py ../download/dist/*.whl --report .internal/ci/abi3.json
      - uses: actions/upload-artifact@v4
        with:
          name: abi3-${{ matrix.os }}-python-${{ matrix.python }}
          path: edrawings-kit/.internal/ci/abi3.json
          if-no-files-found: error
          include-hidden-files: true
