[workspace]
members = ["crates/edrawings-core", "crates/edrawings-python"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
repository = "https://github.com/monozukuri-ai/edrawings-kit"

[workspace.dependencies]
hsf-core = { version = "=0.1.0-alpha.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
quick-xml = "0.41"
roxmltree = "0.21"
pyo3 = { version = "=0.29.2", features = ["abi3-py310"] }

[workspace.lints.rust]
unsafe_code = "forbid"
